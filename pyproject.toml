[project]
name = "pollicount"
version = "0.1.0"
description = "Zero-shot pollinator counting from an ordinary phone video, for citizen science."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "meta-sam-parser>=0.1.0",
    "openai>=3.0",
]

[project.scripts]
pollicount = "pollicount.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
