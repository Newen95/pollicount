[project]
name = "pollicount"
version = "0.1.0"
description = "Zero-shot pollinator counting from an ordinary phone video, for citizen science."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "meta-sam-parser>=0.1.0",
    "openai>=3.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pollicount = "pollicount.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=8",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"pollicount/video.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["pollicount"]
known-local-folder = ["samples", "test_pipeline"]
